<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 535" role="img" aria-labelledby="title desc"><title id="title">一轮带工具调用的对话</title><desc id="desc">Runner 读取会话，调用模型；若模型选择工具，Runner 执行并带回工具结果，再发送事件并写入会话。</desc><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#216d79"/></marker></defs><rect width="930" height="535" rx="14" fill="#f7fafb"/><g font-family="system-ui,sans-serif" text-anchor="middle">
<rect x="9" y="22" width="126" height="38" rx="8" fill="#19384a"/><text x="72" y="47" fill="white" font-size="17">调用方</text><path d="M72 62 V509" stroke="#9eb5bd" stroke-dasharray="4 5"/>
<rect x="171" y="22" width="126" height="38" rx="8" fill="#19384a"/><text x="234" y="47" fill="white" font-size="17">Harness App</text><path d="M234 62 V509" stroke="#9eb5bd" stroke-dasharray="4 5"/>
<rect x="327" y="22" width="126" height="38" rx="8" fill="#19384a"/><text x="390" y="47" fill="white" font-size="17">Runner</text><path d="M390 62 V509" stroke="#9eb5bd" stroke-dasharray="4 5"/>
<rect x="485" y="22" width="126" height="38" rx="8" fill="#19384a"/><text x="548" y="47" fill="white" font-size="17">会话服务</text><path d="M548 62 V509" stroke="#9eb5bd" stroke-dasharray="4 5"/>
<rect x="639" y="22" width="126" height="38" rx="8" fill="#19384a"/><text x="702" y="47" fill="white" font-size="17">模型</text><path d="M702 62 V509" stroke="#9eb5bd" stroke-dasharray="4 5"/>
<rect x="791" y="22" width="126" height="38" rx="8" fill="#19384a"/><text x="854" y="47" fill="white" font-size="17">工具</text><path d="M854 62 V509" stroke="#9eb5bd" stroke-dasharray="4 5"/>
<rect x="374" y="227" width="539" height="141" rx="8" fill="#e3f1ee" fill-opacity=".82"/><text x="843" y="248" fill="#28695f" font-size="13">可选工具调用</text>
<path d="M72 98 H234" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="153.0" y="92" fill="#19384a" font-size="15">消息与会话 ID</text>
<path d="M234 138 H390" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="312.0" y="132" fill="#19384a" font-size="15">本轮 Agent 和输入</text>
<path d="M390 178 H548" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="469.0" y="172" fill="#19384a" font-size="15">读取上下文</text>
<path d="M390 218 H702" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="546.0" y="212" fill="#19384a" font-size="15">提交推理请求</text>
<path d="M702 258 H390" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="546.0" y="252" fill="#19384a" font-size="15">请求调用工具</text>
<path d="M390 298 H854" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="622.0" y="292" fill="#19384a" font-size="15">执行并取得工具结果</text>
<path d="M390 338 H702" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="546.0" y="332" fill="#19384a" font-size="15">带回工具结果</text>
<path d="M702 378 H390" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="546.0" y="372" fill="#19384a" font-size="15">生成回复</text>
<path d="M390 418 H548" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="469.0" y="412" fill="#19384a" font-size="15">记录执行事件</text>
<path d="M390 458 H234" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="312.0" y="452" fill="#19384a" font-size="15">交付事件或结果</text>
<path d="M234 498 H72" stroke="#216d79" stroke-width="1.8" marker-end="url(#end)"/><text x="153.0" y="492" fill="#19384a" font-size="15">响应</text>
</g></svg>