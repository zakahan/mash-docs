<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650"><title>更新 Harness 后主动刷新会话快照的时序</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#216d79"/></marker></defs><rect width="1040" height="650" fill="#f7fafb"/><g font-family="sans-serif" fill="#19384a"><text x="520" y="34" text-anchor="middle" font-size="18" font-weight="bold">UpdateHarness 后，一次主动刷新怎样生效</text><g font-size="15" font-weight="bold"><rect x="34" y="62" width="190" height="54" rx="7" fill="#deedf2"/><text x="129" y="95" text-anchor="middle">调用方</text><rect x="298" y="62" width="190" height="54" rx="7" fill="#deedf2"/><text x="393" y="95" text-anchor="middle">AgentKit 控制面</text><rect x="562" y="62" width="190" height="54" rx="7" fill="#deedf2"/><text x="657" y="95" text-anchor="middle">Harness App</text><rect x="826" y="62" width="180" height="54" rx="7" fill="#deedf2"/><text x="916" y="95" text-anchor="middle">Session 后端</text></g><g stroke="#9eb3bd" stroke-dasharray="5 5"><path d="M129 116V612"/><path d="M393 116V612"/><path d="M657 116V612"/><path d="M916 116V612"/></g><g font-size="14"><path d="M129 155H387" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="145" text-anchor="middle">1. UpdateHarness</text><path d="M387 182H135" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="207" text-anchor="middle">控制面保存新配置</text><path d="M129 256H651" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="246" text-anchor="middle">2. /run_sse（refreshSnapshot: true）</text><path d="M657 300H910" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="783" y="290" text-anchor="middle">3. 读取 Session 绑定</text><path d="M910 327H663" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="783" y="351" text-anchor="middle">返回三个资源 ID</text><path d="M657 394H399" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="384" text-anchor="middle">4. GetHarness + GetEnvironment</text><path d="M399 421H651" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="445" text-anchor="middle">返回并校验最新配置</text><rect x="573" y="466" width="168" height="52" rx="6" fill="#fff" stroke="#8db4bd"/><text x="657" y="488" text-anchor="middle">生成候选快照</text><text x="657" y="508" text-anchor="middle" font-size="12">失败则停止本轮</text><path d="M657 546H910" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="783" y="536" text-anchor="middle">5. 更新会话配置基线</text><path d="M910 573H663" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="783" y="597" text-anchor="middle">成功后发布快照并执行</text><path d="M657 622H135" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="393" y="644" text-anchor="middle">6. 通过 SSE 返回本轮事件</text></g></g></svg>
