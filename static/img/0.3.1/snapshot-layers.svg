<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"><title>会话绑定、实例快照与单轮覆盖的分层关系</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#216d79"/></marker></defs><rect width="960" height="560" fill="#f7fafb"/><g font-family="sans-serif" fill="#19384a"><text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold">配置从控制面进入会话，再在单轮请求中生效</text><rect x="52" y="74" width="250" height="118" rx="8" fill="#deedf2"/><text x="177" y="105" text-anchor="middle" font-size="16" font-weight="bold">AgentKit 控制面</text><text x="177" y="134" text-anchor="middle" font-size="14">Harness</text><text x="177" y="158" text-anchor="middle" font-size="14">Environment</text><text x="177" y="181" text-anchor="middle" font-size="13" fill="#607d8b">长期配置来源</text><rect x="355" y="74" width="250" height="118" rx="8" fill="#deedf2"/><text x="480" y="105" text-anchor="middle" font-size="16" font-weight="bold">Session state</text><text x="480" y="134" text-anchor="middle" font-size="14">workspace_id · harness_id</text><text x="480" y="158" text-anchor="middle" font-size="14">environment_id</text><text x="480" y="181" text-anchor="middle" font-size="13" fill="#607d8b">持久化配置来源</text><rect x="658" y="74" width="250" height="118" rx="8" fill="#deedf2"/><text x="783" y="105" text-anchor="middle" font-size="16" font-weight="bold">实例快照 S</text><text x="783" y="134" text-anchor="middle" font-size="14">模型 · 指令 · Skill · MCP</text><text x="783" y="158" text-anchor="middle" font-size="14">沙箱运行参数</text><text x="783" y="181" text-anchor="middle" font-size="13" fill="#607d8b">解析后的内存缓存</text><path d="M308 120H349" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="329" y="108" text-anchor="middle" font-size="12">创建</text><path d="M611 120H652" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="631" y="108" text-anchor="middle" font-size="12">解析</text><path d="M480 198V260" stroke="#216d79" stroke-width="2" stroke-dasharray="5 5"/><text x="494" y="233" font-size="12">定位依据</text><path d="M783 198V260" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="797" y="233" font-size="12">普通请求复用</text><rect x="355" y="266" width="553" height="112" rx="8" fill="#fff" stroke="#8db4bd" stroke-width="1.5"/><text x="631" y="298" text-anchor="middle" font-size="16" font-weight="bold">本轮执行配置 E</text><text x="631" y="327" text-anchor="middle" font-size="14">merge(实例快照 S, request.harness)</text><text x="631" y="354" text-anchor="middle" font-size="13" fill="#607d8b">从快照复制，只在当前轮次使用</text><rect x="52" y="266" width="250" height="112" rx="8" fill="#fff" stroke="#8db4bd" stroke-width="1.5"/><text x="177" y="298" text-anchor="middle" font-size="16" font-weight="bold">/run_sse 请求</text><text x="177" y="327" text-anchor="middle" font-size="14">可选 harness object</text><text x="177" y="354" text-anchor="middle" font-size="13" fill="#607d8b">当前一轮临时覆盖</text><path d="M308 322H349" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/><text x="329" y="310" text-anchor="middle" font-size="12">合并</text><rect x="355" y="432" width="553" height="78" rx="8" fill="#e9f3ef"/><text x="631" y="464" text-anchor="middle" font-size="16" font-weight="bold">Runner 执行模型与工具</text><text x="631" y="490" text-anchor="middle" font-size="13">事件通过 SSE 返回；单轮覆盖不写回快照</text><path d="M631 384V426" stroke="#216d79" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
