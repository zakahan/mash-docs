<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Session 固定 Harness 版本、实例自动重建快照和主动升级的关系</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#216d79"/></marker></defs><rect width="960" height="720" fill="#f7fafb"/><g font-family="sans-serif" font-size="15" fill="#19384a"><rect x="36" y="30" width="250" height="88" rx="7" fill="#deedf2"/><text x="161" y="59" text-anchor="middle" font-weight="bold">AgentKit 控制面</text><text x="161" y="84" text-anchor="middle">Harness v1 → UpdateHarness → v2</text><text x="161" y="106" text-anchor="middle" font-size="13">历史版本仍可按版本号查询</text><rect x="355" y="30" width="250" height="88" rx="7" fill="#deedf2"/><text x="480" y="59" text-anchor="middle" font-weight="bold">持久化 Session 后端</text><text x="480" y="84" text-anchor="middle">三个绑定 ID</text><text x="480" y="106" text-anchor="middle">harnessVersion = 1</text><rect x="674" y="30" width="250" height="88" rx="7" fill="#deedf2"/><text x="799" y="59" text-anchor="middle" font-weight="bold">Harness App 实例 A</text><text x="799" y="84" text-anchor="middle">内存快照 S(v1)</text><text x="799" y="106" text-anchor="middle" font-size="13">普通消息复用缓存</text><path d="M674 73H611" stroke="#216d79" marker-end="url(#a)"/><text x="642" y="61" text-anchor="middle" font-size="13">核对版本</text><rect x="674" y="157" width="250" height="82" rx="7" fill="#fff" stroke="#8db4bd"/><text x="799" y="186" text-anchor="middle" font-weight="bold">控制面已有 v2</text><text x="799" y="211" text-anchor="middle">普通消息仍执行 S(v1)</text><path d="M799 124V151" stroke="#216d79" marker-end="url(#a)"/><path d="M34 285H926" stroke="#abc" stroke-dasharray="6 6"/><text x="480" y="273" text-anchor="middle" fill="#607d8b">实例 A 销毁：内存缓存消失；Session 仍保存绑定、版本和对话历史</text><rect x="355" y="326" width="250" height="88" rx="7" fill="#deedf2"/><text x="480" y="355" text-anchor="middle" font-weight="bold">原 Session</text><text x="480" y="380" text-anchor="middle">读取 harnessVersion = 1</text><text x="480" y="402" text-anchor="middle" font-size="13">版本事实仍在数据库</text><rect x="674" y="326" width="250" height="88" rx="7" fill="#deedf2"/><text x="799" y="355" text-anchor="middle" font-weight="bold">Harness App 实例 B</text><text x="799" y="380" text-anchor="middle">尚无对应快照</text><text x="799" y="402" text-anchor="middle" font-size="13">收到普通消息</text><path d="M674 370H611" stroke="#216d79" marker-end="url(#a)"/><text x="642" y="357" text-anchor="middle" font-size="13">读取 Session</text><rect x="36" y="461" width="250" height="82" rx="7" fill="#fff" stroke="#8db4bd"/><text x="161" y="490" text-anchor="middle">GetHarness</text><text x="161" y="515" text-anchor="middle">HarnessVersion = 1</text><rect x="674" y="461" width="250" height="82" rx="7" fill="#fff" stroke="#8db4bd"/><text x="799" y="490" text-anchor="middle">自动重建 S(v1)</text><text x="799" y="515" text-anchor="middle">随后执行普通消息</text><path d="M674 490H292" stroke="#216d79" marker-end="url(#a)"/><path d="M286 521H668" stroke="#216d79" marker-end="url(#a)"/><rect x="36" y="598" width="250" height="82" rx="7" fill="#fff" stroke="#8db4bd"/><text x="161" y="627" text-anchor="middle">GetHarness（不传版本）</text><text x="161" y="652" text-anchor="middle">返回当前最新 v2</text><rect x="355" y="598" width="250" height="82" rx="7" fill="#fff" stroke="#8db4bd"/><text x="480" y="627" text-anchor="middle">先持久化</text><text x="480" y="652" text-anchor="middle">harnessVersion = 2</text><rect x="674" y="598" width="250" height="82" rx="7" fill="#fff" stroke="#8db4bd"/><text x="799" y="627" text-anchor="middle">refreshSnapshot: true</text><text x="799" y="652" text-anchor="middle">发布 S(v2) 后执行本轮</text><path d="M674 624H611" stroke="#216d79" marker-end="url(#a)"/><path d="M355 639H292" stroke="#216d79" marker-end="url(#a)"/><path d="M286 660H349" stroke="#216d79" marker-end="url(#a)"/><path d="M605 660H668" stroke="#216d79" marker-end="url(#a)"/></g></svg>
